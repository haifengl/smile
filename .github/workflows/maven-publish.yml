name: Publish Libraries to Maven Central

on:
  workflow_dispatch:
  release:
    types: [ published ]
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

jobs:
  publish:
    name: Build and Publish (Java 25)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Grant execute permissions
        run: chmod +x gradlew clojure/lein

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.GPG_KEY_ID }}:6:" | gpg --import-ownertrust
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish libraries to Maven Central
        run: |
          sbt publishSigned
          sbt ++2.13.18 scala/publishSigned
          sbt ++2.13.18 json/publishSigned
          sbt sonaRelease
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Clojure package to Clojars
        run: |
          sbt base/publishM2
          sbt core/publishM2
          (cd clojure && ./lein deploy clojars)
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_TOKEN }}
