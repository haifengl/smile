name: Publish Libraries

on:
  workflow_dispatch:
  release:
    types: [ published ]
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

jobs:
  publish:
    name: Build and Publish (Java 25)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, 'v'))

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Grant execute permissions
        run: chmod +x gradlew clojure/lein

      - name: Import GPG signing key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat << 'EOF' > ~/.gnupg/gpg-agent.conf
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 86400
          max-cache-ttl 86400
          EOF
          cat << 'EOF' > ~/.gnupg/gpg.conf
          batch
          no-tty
          pinentry-mode loopback
          EOF
          chmod 600 ~/.gnupg/gpg-agent.conf ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$GPG_PRIVATE_KEY" | tr -d '\r' | awk '
            /-----BEGIN PGP/ { print "-----BEGIN PGP PRIVATE KEY BLOCK-----\n"; in_block=1; next }
            /-----END PGP/   { print "-----END PGP PRIVATE KEY BLOCK-----"; in_block=0; next }
            in_block {
              gsub(/^[ \t]+|[ \t]+$/, "")
              if ($0 != "" && $0 !~ /:/ && $0 ~ /^[A-Za-z0-9+\/=]+$/) print $0
            }
          ' | gpg --batch --import || true
          if [ -n "$GPG_KEY_ID" ]; then
            FPR=$(gpg --list-secret-keys --with-colons "$GPG_KEY_ID" | awk -F: '/^fpr:/ { print $10; exit }')
          else
            FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          fi
          if [ -z "$FPR" ]; then
            echo "ERROR: GPG secret key was not imported" >&2
            exit 1
          fi
          echo "${FPR}:6:" | gpg --batch --import-ownertrust
          if [ -n "$GPG_PASSPHRASE" ]; then
            PRESET_TOOL=$(find /usr/lib/gnupg /usr/libexec -name gpg-preset-passphrase 2>/dev/null | head -n 1)
            if [ -n "$PRESET_TOOL" ]; then
              for KEYGRIP in $(gpg --list-secret-keys --with-colons "$FPR" | awk -F: '/^grp:/ { print $10 }'); do
                printf '%s' "$GPG_PASSPHRASE" | "$PRESET_TOOL" --preset "$KEYGRIP"
              done
            fi
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish libraries to Maven Central
        run: |
          rm -rf target/sona-staging target/sona-bundle
          sbt publishSigned
          sbt ++2.13.18 scala/publishSigned
          sbt ++2.13.18 json/publishSigned
          sbt sonaBundle
          BUNDLE_FILE="target/sona-bundle/bundle.zip"
          ls -lh "$BUNDLE_FILE"
          USER_CLEAN=$(printf '%s' "$NEXUS_USERNAME" | tr -d '[:space:]')
          PASS_CLEAN=$(printf '%s' "$NEXUS_PASSWORD" | tr -d '[:space:]')
          AUTH=$(printf '%s:%s' "$USER_CLEAN" "$PASS_CLEAN" | base64 -w 0)
          DEPLOY_NAME="com.github.haifengl:smile:$(date +%Y%m%d_%H%M%S)"
          HTTP_CODE=$(curl -sS --retry 3 --retry-delay 10 --max-time 600 \
            -o /tmp/sona_upload.txt -w "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $AUTH" \
            --form "bundle=@${BUNDLE_FILE};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${DEPLOY_NAME}&publishingType=AUTOMATIC")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Upload failed with HTTP $HTTP_CODE (username length=${#USER_CLEAN}, password length=${#PASS_CLEAN}):" >&2
            cat /tmp/sona_upload.txt >&2
            echo "" >&2
            exit 1
          fi
          DEPLOY_ID=$(cat /tmp/sona_upload.txt | tr -d '[:space:]')
          echo "Uploaded deployment ID: $DEPLOY_ID"
          for i in $(seq 1 60); do
            STATUS_JSON=$(curl -fsSL --retry 3 --retry-delay 5 \
              --request POST \
              --header "Authorization: Bearer $AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOY_ID}")
            STATE=$(printf '%s' "$STATUS_JSON" | jq -r '.deploymentState // empty')
            echo "Deployment $DEPLOY_ID state ($i/60): $STATE"
            case "$STATE" in
              PUBLISHED|PUBLISHING)
                echo "Deployment $DEPLOY_ID reached $STATE."
                break
                ;;
              FAILED)
                echo "Deployment $DEPLOY_ID failed:" >&2
                printf '%s\n' "$STATUS_JSON" | jq . >&2
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Clojure package to Clojars
        run: |
          sbt base/publishM2
          sbt core/publishM2
          (cd clojure && ./lein deploy clojars)
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_TOKEN }}
