name: Publish Libraries to Maven Central

on:
  workflow_dispatch:
  release:
    types: [ published ]
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

jobs:
  publish:
    name: Build and Publish (Java 25)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, 'v'))

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Grant execute permissions
        run: chmod +x gradlew clojure/lein

      - name: Import GPG signing key
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | tr -d '\r' | awk '/^-----BEGIN PGP/{p=1} p{print} /^-----END PGP/{p=0}' | gpg --batch --import
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          if [ -n "$GPG_KEY_ID" ]; then
            FPR=$(gpg --list-secret-keys --with-colons "$GPG_KEY_ID" | awk -F: '/^fpr:/ { print $10; exit }')
          else
            FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          fi
          echo "${FPR}:6:" | gpg --batch --import-ownertrust
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish libraries to Maven Central
        run: |
          sbt publishSigned
          sbt ++2.13.18 scala/publishSigned
          sbt ++2.13.18 json/publishSigned
          sbt sonaRelease
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Clojure package to Clojars
        run: |
          sbt base/publishM2
          sbt core/publishM2
          (cd clojure && ./lein deploy clojars)
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_TOKEN }}
