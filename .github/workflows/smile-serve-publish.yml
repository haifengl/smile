name: Publish Serve Container Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version number (e.g., 7.0.1)'
        required: true
        type: string
        default: '7.0.0'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  NAMESPACE: haifengl

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      # The images are independent; one failing (e.g. a native build running out of memory) must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # Dockerfile copies a host-built serve/build/quarkus-app (context ./serve), so it is the only
          # entry that needs the host-side Java/Node/Gradle steps below.
          - image_name: smile-serve
            tag_suffix: ""
            dockerfile: ./serve/src/main/docker/Dockerfile
            context: ./serve
            host_build: true
          # The remaining images build everything inside Docker (repo root as context), with the `local`
          # Quarkus profile by default.
          - image_name: smile-serve
            tag_suffix: "-gpu"
            dockerfile: ./serve/src/main/docker/Dockerfile.gpu
            context: .
            host_build: false
          # Native executable, CPU-only: SMILE, ONNX, CPU chat, auth and the embedded H2 database.
          - image_name: smile-serve
            tag_suffix: "-native"
            dockerfile: ./serve/src/main/docker/Dockerfile.native
            context: .
            host_build: false
          # Native executable, inference-only (no chat, auth or database).
          - image_name: smile-serve
            tag_suffix: "-micro"
            dockerfile: ./serve/src/main/docker/Dockerfile.micro
            context: .
            host_build: false

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The GPU and native images build everything inside Docker (CUDA toolchain and LibTorch, GraalVM, Gradle caches),
      # which together with the 16 GB GPU image does not fit in the ~14 GB a hosted runner has free. Delete the
      # preinstalled toolchains this job does not use (and the pre-pulled Docker images) first.
      - name: Free disk space
        if: ${{ !matrix.host_build }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Set up Java 25
        if: matrix.host_build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        if: matrix.host_build
        run: chmod +x gradlew

      - name: Set up Node.js 24
        if: matrix.host_build
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run npm install for Quinoa
        if: matrix.host_build
        run: |
          cd serve/src/main/webui
          npm install

      - name: Build app
        if: matrix.host_build
        run: |
          ./gradlew :serve:build -Dquarkus.profile=local -x test
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            # Apply semantic versioning tags (e.g., 1.2.3, 1.2, 1)
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            type=raw,value=${{ github.event.inputs.version }}${{ matrix.tag_suffix }}
            # Apply the 'latest' tag only on the default branch push
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
