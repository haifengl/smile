[versions]
arrow = "19.0.0"
fastxml = "2.22.2"
jackson = "3.2.3"
jsonschema = "4.38.0"
# Keep in sync with `kotlinVersion` in kotlin/build.sbt and the Kotlin
# Gradle plugin version in buildSrc/build.gradle.kts.
kotlin = "2.4.20"

[libraries]
arrow-dataset = { module = "org.apache.arrow:arrow-dataset", version.ref = "arrow" }
arrow-memory-netty = { module = "org.apache.arrow:arrow-memory-unsafe", version.ref = "arrow" }
fastxml-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "fastxml" }
fastxml-datatype = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "fastxml" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jsonschema-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "jsonschema" }
jsonschema-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "jsonschema" }
jsonschema-swagger = { module = "com.github.victools:jsonschema-module-swagger-2", version.ref = "jsonschema" }
sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
swingx = { module = "org.swinglabs:swingx", version = "1.6.1" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

[bundles]
arrow = ["arrow-dataset", "arrow-memory-netty"]
jackson = ["jackson-databind", "jackson-yaml"]
jsonschema = ["jsonschema-generator", "jsonschema-jackson"]
fastxml = ["fastxml-databind", "fastxml-datatype"]
