# HTTP server configuration (runtime property)
quarkus.package.output-name=smile-serve
quarkus.rest.path=/api/v1
smile.serve.model=/model
smile.onnx.model=/model
smile.chat.model=/model/Llama-3.1-8B-Instruct
# 0 = auto: use max_position_embeddings from the model config.json
smile.chat.max-seq-len=0
# Max in-flight chat generations (InferenceEngine Fluid Injection cap)
smile.chat.max-batch-size=1
# Max decode batch per step (0 = same as max-batch-size)
# smile.chat.max-decode-batch=0
# Prefill token budget per scheduler tick (chunked prefill)
# smile.chat.prefill-token-budget=2048
# Admission wait timeout ms (0 = wait until KV frees)
# smile.chat.admission-timeout-ms=120000
smile.chat.mem-fraction-static=0.85
# 0 = auto: min(8, CPUs), capped by safetensors shard count
# smile.chat.model-loader-threads=2
smile.chat.devices=0
# smile.chat.devices=0,7
# smile.chat.tensor-parallel-size=2
# smile.chat.pipeline-parallel-size=1
# smile.chat.attention-backend=flashinfer
# smile.chat.attention-backend=torch_native
# smile.chat.flashinfer-aot-dir=/opt/flashinfer/aot
# smile.chat.flashinfer-cache-dir=${user.home}/.cache/smile/flashinfer
# smile.chat.flashinfer-download=false
# smile.chat.flashinfer-cuda-tag=cu130
# smile.chat.flashinfer-allow-torch-fallback=true
# smile.chat.kv-cache.dtype=bfloat16
# smile.chat.kv-cache.page-size=16
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:/model/smile_serve;AUTO_SERVER=TRUE
quarkus.hibernate-orm.active=true
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true

# ---- Dev profile ----
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./smile_serve;AUTO_SERVER=TRUE
%dev.quarkus.hibernate-orm.active=true
%dev.quarkus.http.port=8888
%dev.quarkus.log.level=DEBUG
%dev.smile.chat.devices=7
# Chat requires an Instruct/chat-tuned checkpoint; the base Llama-3.1-8B
# model continues the prompt template and often loops on user/assistant turns.
%dev.smile.chat.model=meta-llama/Llama-3.1-8B-Instruct
%dev.smile.serve.model=../model
%dev.smile.onnx.model=../model

# ---- Test profile ----
%test.smile.serve.model=serve/src/test/resources/model
%test.smile.onnx.model=serve/src/test/resources/model
# Use an in-memory H2 database so tests are hermetic and fast.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.active=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Point at a non-existent path so ChatService starts in unavailable state
# without attempting Hugging Face download or loading a real GPU model.
%test.smile.chat.model=serve/src/test/resources/no-such-model
%test.smile.chat.attention-backend=torch_native
# Avoid QuarkusBindException when 8081 is already taken (Linux CI / parallel builds).
# RestAssured is updated automatically to the chosen port.
%test.quarkus.http.test-port=0
%test.quarkus.http.test-ssl-port=0
