Tips=Tips for getting started:\n\
1. /help for available commands\n\
2. Shift + ENTER to add a line break in your prompt.\n\
3. TAB to complete code in the notebook.\n\
4. Be as specific as you would with another programmer for the best result.\n\
5. Create custom slash commands for reusable prompts or workflows.\n\
6. Run Shell commands starting with an exclamation mark (!).\n\
7. AI can make mistakes. Always review agent's responses.
