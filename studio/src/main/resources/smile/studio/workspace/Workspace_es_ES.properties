ChiefOfStaffOutput=Como tu jefe de gabinete, puedo ayudarte con:\n\
🎯 Priorizar lo que merece tu atención.\n\
👥 Coordinar el trabajo entre el equipo de agentes.\n\
📋 Sintetizar el progreso, el riesgo y el estado.\n\
🧭 Alinear el trabajo con tus objetivos declarados.\n\
\n\
Tráeme un objetivo o un flujo de novedades y lo convertiré en una próximo paso claro.
DataScientistOutput=Como agente de ciencia de datos de vanguardia, puedo ayudarte con:\n\
🤖 Soluciones automáticas de IA/ML de extremo a extremo según tus requisitos.\n\
🔍 Mejores prácticas y métodos de última generación con búsqueda web.\n\
🏅 Refinamiento dirigido de bloques de código mediante estudio de ablación.\n\
🤝 Solución mejorada usando estrategia iterativa de ensamblado.\n\
📊 Visualización de datos interactiva avanzada.\n\
📂 Procesa datos desde CSV, ARFF, JSON, Avro, Parquet, Iceberg o SQL.\n\
🌐 Servidor de inferencia integrado.\n\
🚀 Ejecuta /init para definir tu problema, tus datos y tu objetivo de modelado.\n\
\n\
Coloca tus datos en la carpeta input/ y ejecuta /automl; el pipeline completo y el modelo final se escribirán en output/.
JavaCoderOutput=Como tu gurú de Java, puedo ayudarte con:\n\
☕ Escribir y refactorizar código moderno en Java 25 y JVM.\n\
🤖 Construir pipelines de datos, ML y visualización con SMILE.\n\
🔍 Revisión de código en estructura, calidad y principios SOLID.\n\
🚀 Revisión de concurrencia (hilos virtuales, concurrencia estructurada) y perfilado de rendimiento.\n\
🛡️ Auditorías de seguridad frente a riesgos OWASP, inyección y deserialización.\n\
🧪 Diseño y revisión de suites de pruebas con JUnit y AssertJ.\n\
🔄 Migraciones de JDK y frameworks, además de patrones de persistencia JPA/Quarkus.\n\
⌨️ Completación de código en línea y generación de fragmentos en el cuaderno.\n\
\n\
Indícame una clase, un fallo de compilación o una celda del cuaderno, y te entregaré código Java limpio y probado.
PythonCoderOutput=Como tu Pythonista, puedo ayudarte con:\n\
🐍 Escribir y refactorizar código Python moderno y estrictamente tipado.\n\
📊 Flujos de trabajo científicos con NumPy, Pandas, Matplotlib, Seaborn y scikit-learn.\n\
📦 Estructura y empaquetado de proyectos con pyproject.toml, uv, ruff, mypy y pytest.\n\
🖥️ Creación de interfaces de línea de comandos limpias con Click y Typer.\n\
🔍 Revisión de código, pruebas basadas en propiedades (Hypothesis) y diseño de API.\n\
🚀 Perfilado de rendimiento y benchmarking con cProfile, PyInstrument y memray.\n\
🛡️ Escaneo de seguridad y auditoría de dependencias.\n\
