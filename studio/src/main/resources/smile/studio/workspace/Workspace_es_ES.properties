Tips=Consejos para empezar:\n\
1. /help para ver los comandos disponibles\n\
2. Shift + ENTER para agregar un salto de línea en tu mensaje.\n\
3. TAB para completar código en el cuaderno.\n\
4. Sé tan específico como lo serías con otro programador para obtener el mejor resultado.\n\
5. Crea comandos slash personalizados para prompts o flujos de trabajo reutilizables.\n\
6. Ejecuta comandos de Shell comenzando con un signo de exclamación (!).\n\
7. La IA puede cometer errores. Revisa siempre las respuestas del agente.
