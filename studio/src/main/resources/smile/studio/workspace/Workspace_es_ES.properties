Tips=Consejos para empezar:\n\
1. /help para ver los comandos disponibles\n\
2. Shift + ENTER para agregar un salto de línea en tu mensaje.\n\
3. TAB para completar código en el cuaderno.\n\
4. Sé tan específico como lo serías con otro programador para obtener el mejor resultado.\n\
5. Crea comandos slash personalizados para prompts o flujos de trabajo reutilizables.\n\
6. Ejecuta comandos de Shell comenzando con un signo de exclamación (!).\n\
7. La IA puede cometer errores. Revisa siempre las respuestas del agente.
WelcomeOutput=cwd: {0}
ChiefOfStaffOutput=Como tu jefe de gabinete, puedo ayudarte con:\n\
🎯 Priorizar lo que merece tu atención.\n\
👥 Coordinar el trabajo entre el equipo de agentes.\n\
📋 Sintetizar el progreso, el riesgo y el estado.\n\
🧭 Alinear el trabajo con tus objetivos declarados.\n\
\n\
Tráeme un objetivo o un flujo de novedades y lo convertiré en una próximo paso claro.
DataScientistOutput=Como agente de ciencia de datos de vanguardia, puedo ayudarte con:\n\
🤖 Soluciones automáticas de IA/ML de extremo a extremo según tus requisitos.\n\
🔍 Mejores prácticas y métodos de última generación con búsqueda web.\n\
🏅 Refinamiento dirigido de bloques de código mediante estudio de ablación.\n\
🤝 Solución mejorada usando estrategia iterativa de ensamblado.\n\
📊 Visualización de datos interactiva avanzada.\n\
📂 Procesa datos desde CSV, ARFF, JSON, Avro, Parquet, Iceberg o SQL.\n\
🌐 Servidor de inferencia integrado.\n\
🚀 Ejecuta /init para definir tu problema, tus datos y tu objetivo de modelado.\n\
\n\
Coloca tus datos en la carpeta input/ y ejecuta /automl; el pipeline completo y el modelo final se escribirán en output/.
JavaCoderOutput=También puedo ayudarte con la completación y generación de código en el cuaderno.
