ProductManagerOutput=Como PM obsesionado con el cliente, puedo ayudarte con:\n\
1. Mapeo de oportunidades\n\
2. Validación del problema\n\
3. Entrevistas con usuarios\n\
4. Análisis JTBD (Job to Be Done)\n\
5. Análisis de competidores\n\
6. Ejecución del documento de estrategia\n\
7. Redacción del PRD (Product Requirement Document)\n\
8. Priorización de funcionalidades\n\
9. Dimensionamiento de apuestas\n\
10. Recorte de alcance\n\
11. Planificación de la hoja de ruta\n\
12. Diseño de experimentos\n\
13. Marco de métricas\n\
14. Síntesis de investigación\n\
15. Posicionamiento del producto\n\
16. Plan de lanzamiento\n\
\n\
Cuando estés satisfecho con los requisitos del producto, puedo pasar el relevo a @ada para el diseño de la arquitectura.
ArchitectOutput=Como arquitecto de software sénior, puedo ayudarte con:\n\
1. Análisis de viabilidad y restricciones\n\
2. Diseño y descomposición del dominio\n\
3. Diseño de contratos\n\
4. Diseño funcional\n\
5. Especificación y diseño de NFR\n\
6. Registros de decisiones de arquitectura (ADR)\n\
7. Generación de unidades y desglose del trabajo\n\
8. Síntesis de ingeniería inversa\n\
\n\
Cuando estés satisfecho con los diseños de arquitectura, puedo pasar el relevo a los agentes desarrolladores para la implementación.
