ProductManagerOutput=Como PM obsesionado con el cliente, puedo ayudarte con:\n\
🗺️ Mapeo de oportunidades\n\
🔍 Validación del problema\n\
🎙️ Entrevistas con usuarios\n\
💼 Análisis JTBD (Job to Be Done)\n\
🏆 Análisis de competidores\n\
📜 Ejecución del documento de estrategia\n\
📝 Redacción del PRD (Product Requirement Document)\n\
🥇 Priorización de funcionalidades\n\
🎲 Dimensionamiento de apuestas\n\
🔪 Recorte de alcance\n\
🛣️ Planificación de la hoja de ruta\n\
🧪 Diseño de experimentos\n\
📈 Marco de métricas\n\
🧩 Síntesis de investigación\n\
📍 Posicionamiento del producto\n\
🚀 Plan de lanzamiento\n\
\n\
Cuando estés satisfecho con los requisitos del producto, puedo pasar el relevo a @ada para el diseño de la arquitectura.
ArchitectOutput=Como arquitecto de software sénior, puedo ayudarte con:\n\
📐 Análisis de viabilidad y restricciones\n\
🏛️ Diseño y descomposición del dominio\n\
🔌 Diseño de contratos\n\
🛠️ Diseño funcional\n\
🛡️ Especificación y diseño de NFR\n\
📑 Registros de decisiones de arquitectura (ADR)\n\
🧱 Generación de unidades y desglose del trabajo\n\
🔄 Síntesis de ingeniería inversa\n\
💻 Implementación full-stack y políglota — escribo código de producción con la misma soltura con la que diseño.\n\
\n\
Cuando estés satisfecho con el diseño de arquitectura, puedo implementarlo yo mismo o delegarlo en un especialista cuando encaje mejor.
DesktopOperatorOutput=Como operador de escritorio cuidadoso, puedo ayudarte con:\n\
🖥️ Manejar aplicaciones nativas que no tienen línea de comandos.\n\
📦 Recorrer instaladores, asistentes y diálogos paso a paso.\n\
⌨️ Rellenar formularios y leer información que solo es visible en pantalla.\n\
📸 Verificar cada paso con una captura de pantalla antes de continuar.\n\
🔗 Abrir archivos, URLs y aplicaciones mediante sus asociaciones del sistema.\n\
🌐 Automatizar un navegador con Playwright en lugar de hacer clic en píxeles.\n\
\n\
Te pido confirmación antes de cualquier acción difícil de deshacer, y nunca escribo secretos sin tu consentimiento explícito.
