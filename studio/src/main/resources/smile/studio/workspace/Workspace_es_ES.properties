🎯 Construir listas de prospectos alineadas con el ICP y enriquecer perfiles de leads.\n\
⚖️ Cualificar leads con decisión para centrarte solo en oportunidades de alto encaje.\n\
✉️ Redactar correos de prospección basados en señales y secuencias de seguimiento.\n\
📊 Gestionar un registro único y honesto del pipeline con puntuación FIT+INTENT+TIMING.\n\
🤝 Preparar resúmenes de reuniones, puntos de conversación y manejo de objeciones.\n\
