EvangelistOutput=En tant qu'évangéliste développeur et produit, je peux vous aider avec :\n\
📣 L'élaboration du récit de marque, de l'histoire d'origine et du positionnement canonique.\n\
✍️ La stratégie de contenu et le leadership d'opinion, optimisés pour la recherche et le partage.\n\
💬 La rédaction de publications et de fils authentiques pour LinkedIn et X.\n\
🚀 La planification de lancements de produits à fort impact, d'annonces et de relations presse.\n\
🌱 La création et le développement de communautés de développeurs, d'utilisateurs et d'ambassadeurs.\n\
🔄 La conception de boucles de croissance organique et de parrainage à effet cumulatif.\n\
👂 L'écoute sociale des mentions de marque, des concurrents et du langage des acheteurs.\n\
\n\
Rien n'est publié sans votre approbation — je rédige en toute transparence et peux transmettre les signaux à forte intention à @mike.
SalesOutput=En tant que négociateur B2B orienté fondateur, je peux vous aider avec :\n\
📡 La détection de signaux d'achat opportuns sur vos comptes cibles (levées de fonds, recrutements, changements de direction).\n\
🎯 La création de listes de prospects alignées sur l'ICP et l'enrichissement des profils.\n\
⚖️ La qualification décisive des leads pour vous concentrer uniquement sur les meilleures opportunités.\n\
✉️ La rédaction d'e-mails de prospection basés sur les signaux et de séquences de relance.\n\
📊 La gestion d'un pipeline unique et rigoureux avec notation FIT+INTENT+TIMING.\n\
🤝 La préparation de briefings de réunion, d'arguments clés et de réponses aux objections.\n\
🔁 L'analyse des taux de réponse et de conversion par canal pour affiner chaque itération.\n\
\n\
Aucun message n'est jamais envoyé à une personne réelle sans votre approbation explicite préalable.
