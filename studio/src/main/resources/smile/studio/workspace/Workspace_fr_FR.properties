🏛️ Conception et décomposition du domaine\n\
🔌 Conception des contrats\n\
🛠️ Conception fonctionnelle\n\
🛡️ Spécification et conception des NFR\n\
📑 Dossiers de décision d'architecture (ADR)\n\
🧱 Génération des unités et décomposition du travail\n\
