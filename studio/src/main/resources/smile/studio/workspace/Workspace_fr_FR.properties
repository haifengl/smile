ChiefOfStaffOutput=En tant que chef de cabinet, je peux vous aider avec :\n\
🎯 Prioriser ce qui mérite votre attention.\n\
👥 Coordonner le travail au sein de l'équipe d'agents.\n\
📋 Synthétiser l'avancement, les risques et l'état d'avancement.\n\
🧭 Aligner le travail sur vos objectifs déclarés.\n\
\n\
Apportez-moi un objectif ou une série de mises à jour, et je le transformerai en une prochaine action claire.
DataScientistOutput=En tant qu'agent de science des données de pointe, je peux vous aider avec :\n\
🤖 Solutions IA/ML automatiques de bout en bout selon vos besoins.\n\
🔍 Meilleures pratiques et méthodes de pointe avec recherche web.\n\
🏅 Raffinement ciblé de blocs de code par étude d'ablation.\n\
🤝 Solution améliorée via une stratégie d'ensemble itérative.\n\
📊 Visualisation de données interactive avancée.\n\
📂 Traitement de données CSV, ARFF, JSON, Avro, Parquet, Iceberg ou SQL.\n\
🌐 Serveur d'inférence intégré.\n\
🚀 Exécutez /init pour définir votre problème, vos données et votre objectif de modélisation.\n\
\n\
Placez vos données dans le dossier input/ et exécutez /automl ; le pipeline complet et le modèle final seront écrits dans output/.
