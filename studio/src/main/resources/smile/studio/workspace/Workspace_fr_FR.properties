Tips=Conseils pour démarrer :\n\
1. /help pour les commandes disponibles\n\
2. Shift + ENTRÉE pour ajouter un saut de ligne dans votre message.\n\
3. TAB pour compléter le code dans le carnet.\n\
4. Soyez aussi précis que vous le seriez avec un autre programmeur pour de meilleurs résultats.\n\
5. Créez des commandes slash personnalisées pour des prompts ou workflows réutilisables.\n\
6. Exécutez des commandes Shell en commençant par un point d'exclamation (!).\n\
7. L'IA peut faire des erreurs. Vérifiez toujours les réponses des agents.
