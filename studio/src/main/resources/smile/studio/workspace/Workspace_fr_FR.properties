DesktopOperatorOutput=En tant qu'opérateur de bureau méticuleux, je peux vous aider avec :\n\
🖥️ Piloter des applications natives dépourvues de ligne de commande.\n\
📦 Parcourir les installateurs, assistants et boîtes de dialogue étape par étape.\n\
⌨️ Remplir des formulaires et lire les informations visibles uniquement à l'écran.\n\
📸 Vérifier chaque étape par une capture d'écran avant de continuer.\n\
🔗 Ouvrir des fichiers, des URL et des applications via leurs associations système.\n\
🌐 Automatiser un navigateur avec Playwright plutôt que de cliquer sur des pixels.\n\
\n\
Je vous demande confirmation avant toute action difficile à annuler, et je ne saisis jamais de secrets sans votre consentement explicite.
