ChiefOfStaffOutput=En tant que chef de cabinet, je peux vous aider avec :\n\
🎯 Prioriser ce qui mérite votre attention.\n\
👥 Coordonner le travail au sein de l'équipe d'agents.\n\
📋 Synthétiser l'avancement, les risques et l'état d'avancement.\n\
🧭 Aligner le travail sur vos objectifs déclarés.\n\
\n\
Apportez-moi un objectif ou une série de mises à jour, et je le transformerai en une prochaine action claire.
DataScientistOutput=En tant qu'agent de science des données de pointe, je peux vous aider avec :\n\
🤖 Solutions IA/ML automatiques de bout en bout selon vos besoins.\n\
🔍 Meilleures pratiques et méthodes de pointe avec recherche web.\n\
🏅 Raffinement ciblé de blocs de code par étude d'ablation.\n\
🤝 Solution améliorée via une stratégie d'ensemble itérative.\n\
📊 Visualisation de données interactive avancée.\n\
📂 Traitement de données CSV, ARFF, JSON, Avro, Parquet, Iceberg ou SQL.\n\
🌐 Serveur d'inférence intégré.\n\
🚀 Exécutez /init pour définir votre problème, vos données et votre objectif de modélisation.\n\
\n\
Placez vos données dans le dossier input/ et exécutez /automl ; le pipeline complet et le modèle final seront écrits dans output/.
JavaCoderOutput=En tant que votre gourou Java, je peux vous aider avec :\n\
☕ L'écriture et le refactoring de code moderne Java 25 et JVM.\n\
🤖 La construction de pipelines de données, de ML et de visualisation sur SMILE.\n\
🔍 La revue de code couvrant la structure, la qualité et les principes SOLID.\n\
🚀 L'audit de concurrence (threads virtuels, concurrence structurée) et le profilage de performance.\n\
🛡️ Les audits de sécurité (OWASP, injections, désérialisation).\n\
🧪 La conception et la revue de suites de tests JUnit et AssertJ.\n\
🔄 Les migrations de JDK et de frameworks, ainsi que les patterns de persistance JPA/Quarkus.\n\
⌨️ La complétion de code en ligne et la génération d'extraits dans le carnet.\n\
\n\
Indiquez-moi une classe, une erreur de build ou une cellule de carnet, et je vous livrerai du code Java propre et testé.
PythonCoderOutput=En tant que votre Pythonista, je peux vous aider avec :\n\
🐍 L'écriture et le refactoring de code Python moderne et strictement typé.\n\
📊 Les workflows scientifiques avec NumPy, Pandas, Matplotlib, Seaborn et scikit-learn.\n\
📦 L'initialisation et le packaging de projets avec pyproject.toml, uv, ruff, mypy et pytest.\n\
🖥️ La création d'interfaces en ligne de commande propres avec Click et Typer.\n\
🔍 La revue de code, les tests basés sur les propriétés (Hypothesis) et la conception d'API.\n\
🚀 Le profilage de performance et le benchmarking avec cProfile, PyInstrument et memray.\n\
🛡️ L'analyse de sécurité et l'audit des dépendances.\n\
⌨️ La complétion de code en ligne et la génération d'extraits dans le carnet.\n\
\n\
Confiez-moi un script, un pipeline de données, une bibliothèque ou une cellule de carnet, et je produirai du code Python exécutable et bien testé.
