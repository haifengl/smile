Tips=始めるためのヒント：\n\
1. /help で利用可能なコマンドを表示\n\
2. Shift + ENTER でメッセージに改行を追加。\n\
3. TAB でノートブックのコードを補完。\n\
4. 最良の結果を得るために、別のプログラマーに伝えるくらい具体的に指示してください。\n\
5. 再利用可能なプロンプトやワークフロー用にカスタムスラッシュコマンドを作成できます。\n\
6. エクスクラメーションマーク(!)で始めるとシェルコマンドを実行できます。\n\
7. AIは誤りを犯すことがあります。エージェントの応答は必ず確認してください。
