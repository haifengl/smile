Tips=使用技巧：\n\
1. /help 查看可用命令\n\
2. Shift + ENTER 在提示中添加换行。\n\
3. TAB 在笔记本中补全代码。\n\
4. 像与真实程序员沟通一样，尽量具体描述需求以获得最佳结果。\n\
5. 创建自定义斜杠命令以复用常用提示或工作流。\n\
6. 以感叹号(!)开头的内容将作为 Shell 命令执行。\n\
7. AI 可能犯错，请务必审查智能体的回复。
