DesktopOperatorOutput=作为严谨的桌面操作员，我可以帮助您：\n\
1. 操作没有命令行的原生应用程序。\n\
2. 逐步完成安装程序、向导和对话框。\n\
3. 填写表单，并读取仅在屏幕上可见的信息。\n\
4. 每一步都通过截图确认后再继续。\n\
5. 通过系统关联打开文件、URL 和应用程序。\n\
6. 使用 Playwright 自动化浏览器，而不是点击像素。\n\
\n\
对于任何难以撤销的操作，我都会先与您确认；未经您的明确同意，我绝不会输入机密信息。
